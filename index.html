<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbEPS - Suivi Escalade</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Fond texturé effet "roche/fissures" en CSS pur pour éviter les liens brisés */
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 47% 14%, rgba(30, 41, 59, 0.03) 0px, transparent 50%),
                radial-gradient(at 89% 82%, rgba(79, 70, 229, 0.03) 0px, transparent 50%),
                radial-gradient(at 19% 91%, rgba(6, 182, 212, 0.03) 0px, transparent 50%),
                linear-gradient(135deg, rgba(15, 23, 42, 0.02) 25%, transparent 25%), 
                linear-gradient(225deg, rgba(15, 23, 42, 0.02) 25%, transparent 25%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple::after {
            content: "";
            background: rgba(255, 255, 255, 0.3);
            display: block;
            position: absolute;
            border-radius: 50%;
            padding-top: 240%;
            padding-left: 240%;
            margin-left: -120%;
            margin-top: -120%;
            opacity: 0;
            transition: all 0.8s ease;
        }
        .ripple:active::after {
            padding-top: 0;
            padding-left: 0;
            margin-left: 0;
            margin-top: 0;
            opacity: 1;
            transition: 0s;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col pb-28 selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-40 overflow-hidden">
        <div class="absolute inset-0 opacity-10 pointer-events-none flex items-end justify-center">
            <svg class="w-full h-16 text-white" fill="currentColor" viewBox="0 0 100 100" preserveAspectRatio="none">
                <polygon points="0,100 30,20 60,70 80,40 100,100"/>
            </svg>
        </div>

        <div class="max-w-md mx-auto px-4 py-3 flex flex-col items-center gap-2 relative z-10">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" />
                </svg>
                <div class="flex flex-col items-center">
                    <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 to-cyan-200">CLIMB EPS</h1>
                    <span class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Voies & Performance</span>
                </div>
                <svg class="w-7 h-7 text-cyan-400" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm1 7.15c.95-.55 1.5-1.4 1.5-2.45h-2c0 .55-.45 1-1 1s-1-.45-1-1H9c0 1.05.55 1.9 1.5 2.45V12H7v6h2v-4h2v5h2v-5h2v4h2v-6h-3.5V9.15z"/>
                </svg>
            </div>
            
            <div class="w-full bg-red-600/95 text-white text-center py-1.5 px-3 rounded-full text-xs font-bold tracking-wide shadow-inner animate-pulse flex items-center justify-center gap-1.5 border border-red-500">
                <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                PROJET DÉPASSÉ = ÉCHEC
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 mt-4 flex-grow space-y-6">

        <section id="form-p1" class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-slate-200/80 p-5 space-y-4 relative overflow-hidden">
            <div class="absolute right-0 top-0 opacity-5 pointer-events-none translate-x-4 -translate-y-4">
                <svg class="w-32 h-32 text-slate-900" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                </svg>
            </div>

            <div class="flex items-center gap-2 border-b border-slate-100 pb-2 relative z-10">
                <span class="flex items-center justify-center w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold">1</span>
                <h2 class="text-lg font-bold text-slate-800">Nouveau Passage (P1)</h2>
            </div>

            <div class="grid grid-cols-2 gap-3 relative z-10">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Prénom de l'Élève</label>
                    <input type="text" id="student-name" placeholder="Ex: Lucas" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm font-medium transition-all bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Numéro de Voie</label>
                    <input type="number" id="route-number" placeholder="Ex: 12" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm font-medium transition-all bg-slate-50/50">
                </div>
            </div>

            <div class="relative z-10">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Couleur de la Voie</label>
                <div id="color-grid" class="grid grid-cols-5 gap-2"></div>
            </div>

            <div class="space-y-3 relative z-10">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Projet à réaliser</label>
                    <div id="project-p1-grid" class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar snap-x"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Hauteur Réalisée</label>
                    <div id="achieved-p1-grid" class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar snap-x"></div>
                </div>
            </div>

            <button onclick="submitPassage1()" class="ripple w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2 mt-2 relative z-10">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Valider le Premier Passage
            </button>
        </section>

        <section id="modal-p2" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl border border-slate-100 transform scale-100 transition-transform relative overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-2">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-amber-500 text-white text-xs font-bold">2</span>
                        <h2 class="text-lg font-bold text-slate-800">Passage 2 (P2)</h2>
                    </div>
                    <button onclick="closeP2Modal()" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl space-y-1 text-xs text-slate-600 font-medium">
                    <p>Élève : <span id="p2-meta-name" class="font-bold text-slate-800 text-sm"></span></p>
                    <p>Voie : <span id="p2-meta-route" class="font-bold text-slate-800"></span> | Couleur : <span id="p2-meta-color" class="font-bold text-slate-800"></span></p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">P2 - Projet à réaliser</label>
                        <div id="project-p2-grid" class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar snap-x"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">P2 - Hauteur Réalisée</label>
                        <div id="achieved-p2-grid" class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar snap-x"></div>
                    </div>
                </div>

                <button onclick="submitPassage2()" class="ripple w-full bg-gradient-to-r from-amber-500 to-amber-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
                    Valider le Second Passage
                </button>
            </div>
        </section>

        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Tableau des Performances
                </h3>
                <span id="student-count" class="text-xs font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 élève(s)</span>
            </div>

            <div id="printable-area" class="space-y-3">
                <div id="empty-state" class="text-center py-10 bg-white/70 backdrop-blur-md border border-dashed border-slate-300 rounded-3xl flex flex-col items-center justify-center p-6 space-y-3">
                    <svg class="w-16 h-16 text-slate-300" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499c.151-.447.78-.447.931 0l1.243 3.672a1.008 1.008 0 00.959.691l3.816.01c.471.002.667.606.287.882l-3.048 2.207a1.007 1.007 0 00-.364 1.118l1.18 3.612c.146.447-.367.822-.744.544l-3.159-2.332a1.007 1.007 0 00-1.186 0l-3.159 2.332c-.377.278-.89-.097-.743-.544l1.18-3.612a1.007 1.007 0 00-.364-1.118L2.232 9.754c-.38-.276-.184-.88.287-.882l3.816-.01a1.008 1.008 0 00.959-.691l1.243-3.672z" />
                    </svg>
                    <p class="text-sm text-slate-400 font-medium">Aucune donnée saisie pour le moment.<br>Prêt pour la grimpe !</p>
                </div>
                <div id="results-list" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-3 shadow-2xl z-40">
        <div class="max-w-md mx-auto px-4 flex items-center justify-between gap-3">
            <button onclick="resetSession()" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-500 transition-colors">
                <div class="p-2 bg-slate-100 rounded-xl hover:bg-red-50 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </div>
                <span class="text-[10px] font-bold mt-1 uppercase tracking-wider">Reset</span>
            </button>

            <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 text-[9px] font-bold">
                <span class="px-1.5 py-0.5 bg-emerald-500 text-white rounded">2/2 OK</span>
                <span class="px-1.5 py-0.5 bg-yellow-400 text-slate-900 rounded">P2 seul</span>
                <span class="px-1.5 py-0.5 bg-orange-500 text-white rounded">P1 seul</span>
                <span class="px-1.5 py-0.5 bg-red-500 text-white rounded">Échec</span>
            </div>

            <button onclick="exportToPDF()" class="ripple bg-slate-900 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-md hover:bg-slate-800 transition-all">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Export PDF
            </button>
        </div>
    </footer>

    <script>
        // Service Worker Registration for Offline Usage
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker enregistré avec succès ! Scope :', reg.scope))
                    .catch(err => console.log('Échec de l\'enregistrement du Service Worker :', err));
            });
        }

        const COLORS = [
            { name: 'rose', hex: '#ec4899', text: 'white' },
            { name: 'blanc', hex: '#ffffff', text: 'slate-800', border: 'slate-300' },
            { name: 'orange', hex: '#f97316', text: 'white' },
            { name: 'vert', hex: '#22c55e', text: 'white' },
            { name: 'rouge', hex: '#ef4444', text: 'white' },
            { name: 'bleu', hex: '#3b82f6', text: 'white' },
            { name: 'jaune', hex: '#eab308', text: 'slate-900' },
            { name: 'violet', hex: '#a855f7', text: 'white' },
            { name: 'noir', hex: '#0f172a', text: 'white' }
        ];

        const LEVELS = ['Sol', 'D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8', 'TOP'];

        let dataset = JSON.parse(localStorage.getItem('climbing_session_data')) || [];
        
        let selectedColor = null;
        let selectedProjectP1 = null;
        let selectedAchievedP1 = null;
        let selectedProjectP2 = null;
        let selectedAchievedP2 = null;
        let activeP2StudentId = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderColorGrid();
            renderLevelSelectors('project-p1-grid', 'p1-proj', (val) => selectedProjectP1 = val);
            renderLevelSelectors('achieved-p1-grid', 'p1-ach', (val) => selectedAchievedP1 = val);
            renderLevelSelectors('project-p2-grid', 'p2-proj', (val) => selectedProjectP2 = val);
            renderLevelSelectors('achieved-p2-grid', 'p2-ach', (val) => selectedAchievedP2 = val);
            refreshUI();
        });

        function renderColorGrid() {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = COLORS.map(c => `
                <button onclick="selectColor('${c.name}', this)" class="ripple h-9 rounded-xl font-bold text-xs uppercase transition-all transform active:scale-95 shadow-sm border ${c.border ? `border-${c.border}` : 'border-transparent'}" style="background-color: ${c.hex}; color: ${c.text === 'white' ? '#fff' : '#1e293b'}">
                    ${c.name}
                </button>
            `).join('');
        }

        function renderLevelSelectors(targetId, namespace, assignCallback) {
            const container = document.getElementById(targetId);
            container.innerHTML = LEVELS.map((lvl) => `
                <button data-ns="${namespace}" data-val="${lvl}" onclick="selectLevel(this, '${namespace}', '${lvl}', ${assignCallback})" class="snap-center shrink-0 w-12 h-12 rounded-xl bg-slate-100 font-bold text-sm text-slate-700 flex items-center justify-center border-2 border-transparent transition-all shadow-sm">
                    ${lvl}
                </button>
            `).join('');
        }

        function selectColor(colorName, element) {
            element.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('ring-4', 'ring-indigo-600/50', 'scale-95'));
            element.classList.add('ring-4', 'ring-indigo-600/50', 'scale-95');
            selectedColor = colorName;
        }

        function selectLevel(element, namespace, value, assignCallback) {
            document.querySelectorAll(`[data-ns="${namespace}"]`).forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'scale-95');
                b.classList.add('bg-slate-100', 'text-slate-700');
            });
            element.classList.remove('bg-slate-100', 'text-slate-700');
            element.classList.add('bg-indigo-600', 'text-white', 'scale-95');
            assignCallback(value);
        }

        function evaluatePassage(project, achieved) {
            return LEVELS.indexOf(project) === LEVELS.indexOf(achieved);
        }

        function submitPassage1() {
            const nameInp = document.getElementById('student-name');
            const routeInp = document.getElementById('route-number');

            if (!nameInp.value.trim() || !routeInp.value || !selectedColor || !selectedProjectP1 || !selectedAchievedP1) {
                alert("⚠️ Erreur : Veuillez remplir TOUS les champs du Premier Passage.");
                return;
            }

            const successP1 = evaluatePassage(selectedProjectP1, selectedAchievedP1);

            const record = {
                id: Date.now().toString(),
                name: nameInp.value.trim(),
                route: routeInp.value,
                color: selectedColor,
                p1: { project: selectedProjectP1, achieved: selectedAchievedP1, success: successP1 },
                p2: null,
                finalColor: successP1 ? 'orange' : 'rouge'
            };

            dataset.unshift(record);
            saveData();
            
            nameInp.value = '';
            routeInp.value = '';
            selectedColor = null;
            selectedProjectP1 = null;
            selectedAchievedP1 = null;
            
            document.querySelectorAll(`[data-ns="p1-proj"], [data-ns="p1-ach"]`).forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-slate-100', 'text-slate-700');
            });
            renderColorGrid();
            refreshUI();
            
            if (successP1) {
                confetti({ particleCount: 40, spread: 40, origin: { y: 0.8 } });
            }
        }

        function openP2Modal(id) {
            const student = dataset.find(item => item.id === id);
            if (!student) return;

            activeP2StudentId = id;
            selectedProjectP2 = null;
            selectedAchievedP2 = null;

            document.getElementById('p2-meta-name').innerText = student.name;
            document.getElementById('p2-meta-route').innerText = `n°${student.route}`;
            document.getElementById('p2-meta-color').innerText = student.color.toUpperCase();

            document.querySelectorAll(`[data-ns="p2-proj"], [data-ns="p2-ach"]`).forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-slate-100', 'text-slate-700');
            });

            document.getElementById('modal-p2').classList.remove('hidden');
        }

        function closeP2Modal() {
            document.getElementById('modal-p2').classList.add('hidden');
        }

        function submitPassage2() {
            if (!selectedProjectP2 || !selectedAchievedP2) {
                alert("⚠️ Erreur : Saisir le projet et le résultat pour P2.");
                return;
            }

            const student = dataset.find(item => item.id === activeP2StudentId);
            if (student) {
                const successP2 = evaluatePassage(selectedProjectP2, selectedAchievedP2);
                student.p2 = { project: selectedProjectP2, achieved: selectedAchievedP2, success: successP2 };

                const p1Ok = student.p1.success;
                const p2Ok = student.p2.success;

                if (p1Ok && p2Ok) student.finalColor = 'green';
                else if (!p1Ok && p2Ok) student.finalColor = 'yellow';
                else if (p1Ok && !p2Ok) student.finalColor = 'orange';
                else student.finalColor = 'red';

                saveData();
                closeP2Modal();
                refreshUI();

                if (p2Ok) {
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.5 } });
                }
            }
        }

        function saveData() {
            localStorage.setItem('climbing_session_data', JSON.stringify(dataset));
        }

        function refreshUI() {
            const resultsList = document.getElementById('results-list');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('student-count').innerText = `${dataset.length} élève(s)`;

            if (dataset.length === 0) {
                emptyState.classList.remove('hidden');
                resultsList.innerHTML = '';
                return;
            }
            emptyState.classList.add('hidden');

            resultsList.innerHTML = dataset.map(item => {
                let statusBgClass = '';
                if (item.finalColor === 'green') statusBgClass = 'bg-emerald-50/90 border-emerald-200 text-emerald-900';
                else if (item.finalColor === 'yellow') statusBgClass = 'bg-amber-50/90 border-amber-200 text-amber-950';
                else if (item.finalColor === 'orange') statusBgClass = 'bg-orange-50/90 border-orange-200 text-orange-950';
                else statusBgClass = 'bg-red-50/90 border-red-200 text-red-950';

                const matchColor = COLORS.find(c => c.name === item.color);
                const dotColorHex = matchColor ? matchColor.hex : '#cbd5e1';

                return `
                    <div class="p-4 rounded-2xl border transition-all shadow-md backdrop-blur-sm ${statusBgClass} flex flex-col gap-3 relative overflow-hidden">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="w-3.5 h-3.5 rounded-full border border-slate-400 shadow-inner" style="background-color: ${dotColorHex}"></span>
                                <h4 class="font-bold text-base capitalize">${item.name}</h4>
                                <span class="text-xs font-semibold bg-slate-900/10 px-2 py-0.5 rounded-md">Voie ${item.route}</span>
                            </div>
                            
                            ${!item.p2 ? `
                                <button onclick="openP2Modal('${item.id}')" class="ripple bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm transition-all">
                                    <span>P2</span>
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            ` : `
                                <span class="text-[9px] uppercase font-extrabold tracking-wider px-2 py-0.5 rounded-full bg-slate-900/10 text-slate-700">Complet</span>
                            `}
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-white/70 rounded-xl p-2.5 flex items-center justify-between border border-black/5">
                                <div>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wide">Passage 1</p>
                                    <p class="font-semibold text-slate-800">Proj: <span class="font-bold">${item.p1.project}</span></p>
                                    <p class="font-semibold text-slate-800">Réal: <span class="font-bold">${item.p1.achieved}</span></p>
                                </div>
                                <div class="ml-2">
                                    ${item.p1.success ? `
                                        <div class="w-6 h-6 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    ` : `
                                        <div class="w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </div>
                                    `}
                                </div>
                            </div>

                            <div class="bg-white/70 rounded-xl p-2.5 flex items-center justify-between border border-black/5">
                                ${item.p2 ? `
                                    <div>
                                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wide">Passage 2</p>
                                        <p class="font-semibold text-slate-800">Proj: <span class="font-bold">${item.p2.project}</span></p>
                                        <p class="font-semibold text-slate-800">Réal: <span class="font-bold">${item.p2.achieved}</span></p>
                                    </div>
                                    <div class="ml-2">
                                        ${item.p2.success ? `
                                            <div class="w-6 h-6 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                        ` : `
                                            <div class="w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                                            </div>
                                        `}
                                    </div>
                                ` : `
                                    <div class="w-full flex items-center justify-center text-slate-400 italic text-[10px] font-medium">
                                        En attente P2
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetSession() {
            if (confirm("⚠️ Réinitialiser la séance ? Toutes les données seront effacées.")) {
                dataset = [];
                saveData();
                refreshUI();
            }
        }

        function exportToPDF() {
            if (dataset.length === 0) {
                alert("Aucune donnée à exporter.");
                return;
            }
            const element = document.getElementById('printable-area');
            const opt = {
                margin:       12,
                filename:     `Session_Escalade_EPS_${new Date().toLocaleDateString('fr-FR')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
